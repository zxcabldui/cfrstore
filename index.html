<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFR Store</title>
    <!-- Подключение Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f3f4f6);
            color: var(--tg-theme-text-color, #1f2937);
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
        }
    </style>
</head>
<body class="p-4 font-sans antialiased pb-24">

    <!-- Шапка с вашим логотипом -->
    <header class="mb-6 text-center flex flex-col items-center justify-center">
        <!-- Ссылка на логотип в вашем репозитории -->
        <img src="logo.jpg" alt="CFR Store Logo" class="w-24 h-24 rounded-full object-cover shadow-md mb-3 border-2 border-black">
        <h1 class="text-2xl font-bold tracking-wide">CFR STORE</h1>
        <p class="text-sm opacity-70">Официальный магазин одежды</p>
    </header>

    <!-- Список товаров (заполняется автоматически из списка ниже) -->
    <div class="grid grid-cols-2 gap-4" id="catalog"></div>

    <!-- Блок корзины (скрыт по умолчанию) -->
    <div id="cart-section" class="mt-6 p-4 rounded-2xl card border border-gray-100 dark:border-gray-800 hidden">
        <h2 class="text-lg font-bold mb-3">Ваша корзина</h2>
        <div id="cart-items" class="space-y-2 text-sm mb-3"></div>
        <div class="border-t pt-2 flex justify-between font-bold text-sm">
            <span>Итого:</span>
            <span id="cart-total">0 ₽</span>
        </div>
    </div>

    <script>
        // ==========================================
        //  НАСТРОЙКА ВАШИХ ТОВАРОВ (АССОРТИМЕНТ)
        // ==========================================
        // Вы можете легко менять, добавлять или удалять товары здесь.
        // Чтобы добавить товар, просто скопируйте строку и измените данные.
        // Картинки пока стоят стандартные из интернета, вы можете загрузить свои на GitHub и вписать сюда их названия (например: 'tshirt.jpg').
        const products = [
            { 
                name: 'Худи CFR "Classic"', 
                price: 4500, 
                img: 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?q=80&w=300&auto=format&fit=crop' 
            },
            { 
                name: 'Футболка "Oversize"', 
                price: 2200, 
                img: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=300&auto=format&fit=crop' 
            },
            { 
                name: 'Кепка CFR "Base"', 
                price: 1500, 
                img: 'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?q=80&w=300&auto=format&fit=crop' 
            }
        ];

        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        let cart = [];

        // Отображение каталога товаров на экране
        const catalogContainer = document.getElementById('catalog');
        products.forEach((product, index) => {
            catalogContainer.innerHTML += `
                <div class="card p-3 rounded-2xl shadow-sm flex flex-col justify-between border border-gray-100 dark:border-gray-800">
                    <img src="${product.img}" alt="${product.name}" class="w-full h-32 object-cover rounded-xl mb-2">
                    <div>
                        <h3 class="font-semibold text-sm">${product.name}</h3>
                        <p class="text-sm font-bold mt-1 text-indigo-600 dark:text-indigo-400">${product.price} ₽</p>
                    </div>
                    <button onclick="addToCart('${product.name}', ${product.price})" class="w-full mt-3 bg-black text-white py-2 rounded-xl text-xs font-semibold active:scale-95 transition-transform">
                        В корзину
                    </button>
                </div>
            `;
        });

        function addToCart(name, price) {
            const itemIndex = cart.findIndex(item => item.name === name);
            if (itemIndex > -1) {
                cart[itemIndex].quantity += 1;
            } else {
                cart.push({ name, price, quantity: 1 });
            }
            updateCart();
        }

        function updateCart() {
            const cartSection = document.getElementById('cart-section');
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotalContainer = document.getElementById('cart-total');

            if (cart.length === 0) {
                cartSection.classList.add('hidden');
                tg.MainButton.hide();
                return;
            }

            cartSection.classList.remove('hidden');
            cartItemsContainer.innerHTML = '';
            
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                cartItemsContainer.innerHTML += `
                    <div class="flex justify-between items-center">
                        <span>${item.name} (${item.quantity} шт.)</span>
                        <div class="flex items-center gap-2">
                            <span>${item.price * item.quantity} ₽</span>
                            <button onclick="removeFromCart(${index})" class="text-red-500 font-bold px-1">×</button>
                        </div>
                    </div>
                `;
            });

            cartTotalContainer.innerText = `${total} ₽`;

            // Показываем главную кнопку Telegram
            tg.MainButton.setText(`Перейти к оформлению (${total} ₽)`);
            tg.MainButton.show();
        }

        function removeFromCart(index) {
            cart[index].quantity -= 1;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            updateCart();
        }

        // Клик по кнопке оформления — перенаправляет в ваш личный чат с готовым текстом
        tg.onEvent('mainButtonClicked', function() {
            // Формируем красивое текстовое сообщение для вас
            let text = "Привет! Я хочу сделать заказ в CFR Store:\n\n";
            let total = 0;
            cart.forEach(item => {
                text += `• ${item.name} — ${item.quantity} шт. (${item.price * item.quantity} ₽)\n`;
                total += item.price * item.quantity;
            });
            text += `\nИтого к оплате: ${total} ₽`;

            // Кодируем сообщение в формат ссылки
            let telegramUrl = "https://t.me/abeesalsjkd?text=" + encodeURIComponent(text);
            
            // Открываем диалог с вами внутри Telegram
            tg.openTelegramLink(telegramUrl);
        });
    </script>
</body>
</html>
